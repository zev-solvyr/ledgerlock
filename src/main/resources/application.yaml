spring:
  application:
    name: ledger-lock

  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    # THIS IS CRITICAL FOR PRODUCTION:
    # We tell Hibernate NEVER to create or modify tables. Just validate them.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration